name: Publish Padel 04 SaaS v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-padel04-v3.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified final app
        run: |
          echo "Publishing Padel 04 SaaS Ultra Final v3 with 56 modules"
          curl -L "https://files.catbox.moe/0cpczz.html" -o index.html
          test "$(sha256sum index.html | awk '{print $1}')" = "fae9ee1bead5304554323bc4735863085d379170e12a043ac80cb1e3479958d0"
          grep -q 'id="make-cost-control"' index.html
          grep -q 'data-section="core-engine"' index.html
          grep -q 'Tarifas activas por duración' index.html
      - name: Publish to gh-pages
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add index.html
          git commit -m "Publish Padel 04 SaaS Ultra Final v3"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
